<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Connect with Shariar on WhatsApp, Telegram, or Messenger.">
  <title>Shariar — Let's Connect</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a0f;
      --panel: rgba(19, 23, 32, .82);
      --line: rgba(255,255,255,.09);
      --muted: #9ca6b8;
      --text: #f4f6fb;
      --accent: #b8ff5c;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(78, 105, 151, .18), transparent 38%),
        radial-gradient(ellipse at 90% 85%, rgba(145, 255, 82, .09), transparent 34%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap { width: 100%; max-width: 470px; }
    .card {
      position: relative; overflow: hidden;
      border: 1px solid var(--line); border-radius: 28px;
      padding: 36px 26px 24px;
      background: linear-gradient(145deg, rgba(25,29,39,.96), rgba(12,15,22,.96));
      box-shadow: 0 28px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
    }
    .card::before {
      content: ""; position: absolute; width: 210px; height: 210px; border-radius: 50%;
      right: -115px; top: -120px; background: rgba(184,255,92,.12); filter: blur(8px);
      pointer-events: none;
    }
    .avatar {
      position: relative; width: 92px; height: 92px; margin: 0 auto 18px;
      display: grid; place-items: center; border-radius: 28px;
      border: 1px solid rgba(184,255,92,.45);
      background: linear-gradient(145deg, #273342, #11151d);
      box-shadow: 0 0 36px rgba(184,255,92,.10), inset 0 1px 0 rgba(255,255,255,.08);
      color: var(--accent); font-size: 34px; font-weight: 800; letter-spacing: -2px;
    }
    .eyebrow { margin: 0 0 8px; text-align: center; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; text-align: center; font-size: clamp(32px, 8vw, 42px); letter-spacing: -.055em; line-height: 1.08; }
    .intro { max-width: 320px; margin: 13px auto 27px; color: var(--muted); text-align: center; font-size: 15px; line-height: 1.65; }
    .links { display: grid; gap: 12px; }
    .contact {
      display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 13px 16px;
      border: 1px solid var(--line); border-radius: 17px; color: var(--text); text-decoration: none;
      background: rgba(255,255,255,.035);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .contact:hover, .contact:focus-visible { transform: translateY(-2px); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.07); outline: none; }
    .icon { width: 43px; height: 43px; flex: 0 0 43px; display: grid; place-items: center; border-radius: 13px; }
    .icon svg { width: 23px; height: 23px; fill: currentColor; }
    .whatsapp .icon { color: #20d873; background: rgba(32,216,115,.12); }
    .telegram .icon { color: #45b9f4; background: rgba(69,185,244,.12); }
    .messenger .icon { color: #8c9cff; background: rgba(110,130,255,.13); }
    .label { flex: 1; min-width: 0; }
    .label strong { display: block; font-size: 15px; font-weight: 750; }
    .label span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .arrow { color: #6e7889; font-size: 22px; }
    .footer { margin-top: 25px; padding-top: 18px; border-top: 1px solid var(--line); color: #6f798b; text-align: center; font-size: 11px; letter-spacing: .04em; }
    .footer span { color: var(--accent); }
    @media (max-width: 380px) { .card { padding: 29px 17px 20px; border-radius: 23px; } .contact { padding: 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
